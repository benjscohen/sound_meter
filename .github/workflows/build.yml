name: Build and Notarize macOS App

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm test

    - name: Build and check native helper
      run: |
        npm run build:helper
        ./native/bin/sm-helper calendar-status
        ./native/bin/sm-helper mic-apps
    
    - name: Import Code Signing Certificate
      env:
        CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
        CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: ./scripts/ci_import_cert.sh
    
    - name: Build and Notarize App
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm run build

    # electron-builder uploads to a draft release. Only once every installer
    # and the update manifest are there does it go public, so nobody (and no
    # running copy of the app) ever sees a half-uploaded release.
    - name: Publish the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | tee assets.txt
        for file in latest-mac.yml arm64.dmg x64.dmg arm64.zip x64.zip; do
          grep -q "$file" assets.txt || { echo "Missing $file: leaving the release as a draft"; exit 1; }
        done
        gh release edit "$GITHUB_REF_NAME" --draft=false --latest
