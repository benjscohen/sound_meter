<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
    <title>Sound Meter</title>
    <link rel="stylesheet" href="shared/theme.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="stage" data-state="starting">
        <button id="orb" class="orb hit" type="button" aria-label="Sound Meter. Click to see your day, drag to move.">
            <span class="ripple" aria-hidden="true"></span>
            <svg class="glyph glyph-level" viewBox="0 0 24 24" aria-hidden="true">
                <path class="level-1" d="M7 13l5-5 5 5" />
                <path class="level-2" d="M7 18.5l5-5 5 5" />
            </svg>
            <svg class="glyph glyph-paused" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="7" y="6" width="3.6" height="12" rx="1.2" />
                <rect x="13.4" y="6" width="3.6" height="12" rx="1.2" />
            </svg>
            <svg class="glyph glyph-denied" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.5 9.5V11a2.5 2.5 0 0 0 4 2M14.5 9V6.5a2.5 2.5 0 0 0-4.6-1.3" />
                <path d="M7 11a5 5 0 0 0 8 4M17 11c0 .5-.1 1-.2 1.5M12 16v2.5M9.5 18.5h5M5 4l14 16" />
            </svg>
        </button>
        <button id="options" class="hit" type="button" tabindex="-1" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h9m5 0h2M4 17h2m5 0h9" />
                <circle cx="15.5" cy="7" r="2.2" />
                <circle cx="8.5" cy="17" r="2.2" />
            </svg>
            Settings
        </button>
        <div id="pill" role="status" aria-live="polite"></div>
    </div>
    <script src="utils/audio-visualizer.js"></script>
    <script src="renderer.js"></script>
</body>

</html>
