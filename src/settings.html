<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
    <title>Sound Meter Settings</title>
    <link rel="stylesheet" href="shared/theme.css">
    <link rel="stylesheet" href="settings.css">
</head>

<body>
    <div class="titlebar"></div>

    <main class="page">
        <header class="top">
            <div>
                <h1>Settings</h1>
                <p class="sub">Changes apply as you make them.</p>
            </div>
            <span class="saved" id="saved" role="status">Saved</span>
        </header>

        <!-- Listening -->
        <section class="group" aria-labelledby="g-listening">
            <h2 id="g-listening">Listening</h2>
            <div class="card rows">
                <div class="row">
                    <div class="status"><i id="status-dot"></i><span id="status-text">Listening</span></div>
                    <button class="btn" id="pause" type="button">Pause</button>
                </div>
                <label class="row" for="mic">
                    <span class="label"><b>Microphone</b></span>
                    <select id="mic"></select>
                </label>
                <div class="row stacked">
                    <span class="label">
                        <b>Sensitivity</b>
                        <small id="sensitivity-hint"></small>
                    </span>
                    <div class="segmented" id="sensitivity" role="group" aria-label="Sensitivity"></div>
                    <button class="link" id="relearn" type="button" hidden>Relearn my voice</button>
                </div>
                <label class="row" id="calls-row">
                    <span class="label">
                        <b>Listen only during calls</b>
                        <small id="calls-hint">Hide the orb and release the microphone unless another app is using
                            it.</small>
                    </span>
                    <span class="switch"><input type="checkbox" data-setting="onlyDuringCalls"><span></span></span>
                </label>
            </div>
        </section>

        <!-- Orb -->
        <section class="group" aria-labelledby="g-orb">
            <h2 id="g-orb">Orb</h2>
            <div class="card rows">
                <div class="row">
                    <span class="label"><b>Size</b></span>
                    <div class="segmented" data-choice="orbSize" role="group" aria-label="Size">
                        <button type="button" data-value="small">Small</button>
                        <button type="button" data-value="medium">Medium</button>
                        <button type="button" data-value="large">Large</button>
                    </div>
                </div>
                <div class="row">
                    <span class="label"><b>Opacity</b></span>
                    <div class="segmented" data-choice="orbOpacity" role="group" aria-label="Opacity">
                        <button type="button" data-value="1">100%</button>
                        <button type="button" data-value="0.75">75%</button>
                        <button type="button" data-value="0.5">50%</button>
                    </div>
                </div>
                <label class="row">
                    <span class="label">
                        <b>Level symbols</b>
                        <small>Arrows in the orb as it gets louder, so it reads without colour.</small>
                    </span>
                    <span class="switch"><input type="checkbox" data-setting="symbols"><span></span></span>
                </label>
                <div class="row">
                    <span class="label">
                        <b>Position</b>
                        <small>Drag the orb anywhere. This puts it back in the top-right corner.</small>
                    </span>
                    <button class="btn" type="button" data-action="reset-position">Reset</button>
                </div>
            </div>
        </section>

        <!-- Notifications -->
        <section class="group" aria-labelledby="g-notifications">
            <h2 id="g-notifications">Notifications</h2>
            <div class="card rows">
                <label class="row">
                    <span class="label">
                        <b>Nudge me when I’m loud</b>
                        <small>A quiet notification after you’ve been above your limit for a while.</small>
                    </span>
                    <span class="switch"><input type="checkbox" data-setting="nudge"><span></span></span>
                </label>
                <label class="row">
                    <span class="label">
                        <b>Weekly recap</b>
                        <small>One notification when your week is ready. Never during a call.</small>
                    </span>
                    <span class="switch"><input type="checkbox" data-setting="weeklyRecap"><span></span></span>
                </label>
            </div>
        </section>

        <!-- Insights -->
        <section class="group" aria-labelledby="g-insights">
            <h2 id="g-insights">Insights</h2>
            <div class="card rows">
                <label class="row" id="calendar-row">
                    <span class="label">
                        <b>Show meetings from my calendar</b>
                        <small>Read on this Mac while Insights is open. Never stored or sent.</small>
                    </span>
                    <span class="switch"><input type="checkbox" id="calendar"><span></span></span>
                </label>
                <div class="row">
                    <span class="label">
                        <b>Your history</b>
                        <small>How your days and weeks sounded.</small>
                    </span>
                    <button class="btn" type="button" data-action="open-insights">Open Insights</button>
                </div>
            </div>
        </section>

        <!-- General -->
        <section class="group" aria-labelledby="g-general">
            <h2 id="g-general">General</h2>
            <div class="card rows">
                <label class="row">
                    <span class="label"><b>Launch at login</b></span>
                    <span class="switch"><input type="checkbox" id="launch-at-login"><span></span></span>
                </label>
                <div class="row">
                    <span class="label">
                        <b>Updates</b>
                        <small id="version"></small>
                    </span>
                    <button class="btn" id="update" type="button">Check for updates</button>
                </div>
            </div>
        </section>

        <footer class="bottom">
            <button class="btn ghost" type="button" data-action="quit">Quit Sound Meter</button>
            <button class="btn primary" type="button" data-action="close">Done</button>
        </footer>
    </main>

    <script src="settings.js"></script>
</body>

</html>
